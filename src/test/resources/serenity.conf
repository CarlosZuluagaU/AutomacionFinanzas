serenity {
    take.screenshots = FOR_FAILURES
    use.unique.browser = false
    test.root = co.edu.udea.fabrica.finanzas
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
    }
}

chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars,--disable-gpu;--remote-allow-origins=*"""

pages {
    baseUrl       = "http://localhost:3000"
    loginUrl      = "http://localhost:3000/"
    dashboardUrl  = "http://localhost:3000/dashboard"
    transaccionUrl = "http://localhost:3000/dashboard/transaccion"
    historialUrl  = "http://localhost:3000/dashboard/historial"
    metasUrl      = "http://localhost:3000/dashboard/metas"
    reporteUrl    = "http://localhost:3000/dashboard/reporte"
}
